<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>QR Pets</title>
<style>
:root{--bg:#f6f4ff;--cd:#fff;--tx:#1c1b2e;--mu:#6b6a80;--ac:#6c4cf5;--ln:#e3e0f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--cd:#1e1b30;--tx:#f0eefc;--mu:#9d9ab8;--ac:#8f78ff;--ln:#34304f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121f;--cd:#1e1b30;--tx:#f0eefc;--mu:#9d9ab8;--ac:#8f78ff;--ln:#34304f;color-scheme:dark}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;max-width:560px;padding:12px 12px 84px}
h2,h3{margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center}.coin{font-weight:700}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;margin:3px 3px 3px 0}button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}button:disabled{opacity:.4}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:auto}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 0;font-size:12px;margin:0}nav button.on{color:var(--ac)}
.pet{display:flex;gap:10px;align-items:center}.em{font-size:44px}.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px}
.log{max-height:200px;overflow:auto;font-size:14px}.win{color:#2fa86a;font-weight:700}.lose{color:#e04a4a;font-weight:700}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%;background:#2fa86a;transition:width .3s}
</style></head><body>
<div class="top"><h2>🐾 QR Pets</h2><div class="coin">🪙 <span id="co"></span> <span id="ut"></span></div></div>
<div id="v"><div class="card">Loading…</div></div><nav id="nv"></nav>
<script>
const R=[["Common","#8a8a9a"],["Uncommon","#2fa86a"],["Rare","#2f7be0"],["Epic","#a24ae0"],["Legendary","#d99a10"]];
const rar=i=>i<600?0:i<850?1:i<950?2:i<990?3:4;
const NA=["Fluffy","Shadow","Blaze","Frost","Mossy","Zappy","Tiny","Mighty","Sneaky","Golden"],NB=["Fox","Drake","Owl","Slime","Bear","Newt","Wolf","Moth","Crab","Bunny"],EM=["🦊","🐉","🦉","🟢","🐻","🦎","🐺","🦋","🦀","🐰"],TY=["🔥Fire","💧Water","🌿Leaf"];
const AB=[{n:"Fireball",i:"🔥",d:"1.8x damage"},{n:"Heal",i:"💚",d:"Restore 30% HP"},{n:"Stun",i:"⚡",d:"Enemy skips a turn"},{n:"Shield",i:"🛡️",d:"Halve the next hit"},{n:"Poison",i:"☠️",d:"5 dmg for 3 turns"},{n:"Drain",i:"🧛",d:"Hit and heal half"}];
const ARM=[{n:"Leather Vest",p:60,d:4},{n:"Iron Plate",p:200,d:10},{n:"Dragon Mail",p:600,d:22}];
const ACC=[{n:"Speed Boots",p:50,a:2,s:3},{n:"Power Ring",p:150,a:7,s:0},{n:"Crown",p:500,a:14,s:5}];
const TIERS=[["rare","Rare",[1,4,7]],["epic","Epic",[2,8,14]],["legend","Legendary",[4,16,28]]],SIZES=[1,5,10];
const LINKS={tip:"",rare1:"",rare5:"",rare10:"",epic1:"",epic5:"",epic10:"",legend1:"",legend5:"",legend10:""};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const pet=i=>{const r=rar(i),b=40+r*18;return{id:i,r,name:NA[i%10]+" "+NB[Math.floor(i/10)%10],em:EM[Math.floor(i/10)%10],t:i%3,hp:b*2+i*7%20,a:Math.round(b/2)+i*3%8,d:Math.round(b/4)+i%5,s:10+i*5%15,ab:r>=3?[i%6,(i+3)%6]:[i%6]}};
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const ok=c=>/^QRP-[A-Z0-9]{8}$/.test(c)&&hash("k7"+c)%61==3&&hash("m2"+c)%61==5;
let S={coins:100,seen:[],pets:[],items:[],gear:{},act:null,wins:0,nick:"",daily:0},tab="scan",msg="",B=null,DB=null,UID=null,ARENA=[],aMsg="";
try{const x=JSON.parse(localStorage.getItem("qrp")||"null");if(x)S={...S,...x}}catch(e){}
const save=()=>{try{localStorage.setItem("qrp",JSON.stringify(S))}catch(e){}if(window.FB&&FB.on&&FB.user)FB.save(S)};
const effG=(p,g)=>{g=g||{};const ar=ARM[g.ar]||{d:0},ac=ACC[g.ac]||{a:0,s:0};return{...p,a:p.a+ac.a,d:p.d+ar.d,s:p.s+ac.s}};
const eff=p=>effG(p,S.gear[p.id]);
function give(id,pre){S.pets.push(id);if(S.act==null)S.act=id;const p=pet(id);msg=`${pre}${p.em} ${p.name} (#${id}) — ${R[p.r][0]}!`;save()}
function daily(){const w=20*36e5-(Date.now()-(S.daily||0));if(w>0){msg=`⏳ Next free pet in about ${Math.ceil(w/36e5)}h`;return render()}
let id,n=0;do{id=Math.floor(Math.random()*600)}while(S.pets.includes(id)&&++n<50);give(id,"🎁 Free daily pet: ");S.daily=Date.now();save();render()}
const dm=(x,y)=>Math.max(1,Math.round(x.a*(x.t==(y.t+2)%3?1.3:x.t==(y.t+1)%3?.8:1)-y.d/2+Math.random()*4));
const mk=p=>({p,hp:p.hp,max:p.hp,sh:0,stun:0,psn:0,cd:{}});
function start(op,pvp){const me=eff(pet(S.act));B={m:mk(me),o:mk(op),log:[`${me.em} ${me.name} vs ${op.em} ${op.name}`],over:0,pvp};tab="fight";render()}
function pve(){const me=pet(S.act),mr=Math.min(4,me.r+(Math.random()<.3?1:0));let id;do{id=Math.floor(Math.random()*1000)}while(rar(id)>mr);const sc=.8+Math.random()*.3,o=pet(id);start({...o,hp:Math.round(o.hp*sc),a:Math.round(o.a*sc)},0)}
function act(s,k,i){const a=B[s],e=B[s=="m"?"o":"m"],who=s=="m"?"You":"Enemy";
const hit=m=>{let d=Math.round(dm(a.p,e.p)*m);if(e.sh){d=Math.ceil(d/2);e.sh=0}e.hp-=d;return d};
if(k=="atk"){const d=hit(1);B.log.push(`${who} hit for ${d}`)}
else if(k=="def"){a.sh=1;B.log.push(`${who} braced for impact`)}
else{const n=AB[i];a.cd[i]=4;let t=`${who} used ${n.i} ${n.n}`;
if(i==0)t+=` for ${hit(1.8)}`;
if(i==1){const h=Math.round(a.max*.3);a.hp=Math.min(a.max,a.hp+h);t+=` +${h} HP`}
if(i==2)e.stun=1;if(i==3)a.sh=1;if(i==4)e.psn=3;
if(i==5){const d=hit(1),h=Math.round(d/2);a.hp=Math.min(a.max,a.hp+h);t+=` for ${d}, +${h} HP`}
B.log.push(t)}}
function turn(k,i){if(!B||B.over)return;const m=B.m,o=B.o;
if(m.stun){m.stun=0;B.log.push("You are stunned!")}else act("m",k,i);
if(o.hp>0){if(o.stun){o.stun=0;B.log.push("Enemy is stunned!")}else{const av=o.p.ab.filter(x=>!(o.cd[x]>0));if(av.length&&Math.random()<.35)act("o","ab",av[Math.floor(Math.random()*av.length)]);else act("o",Math.random()<.15?"def":"atk")}}
for(const u of [m,o]){if(u.psn>0){u.psn--;u.hp-=5;B.log.push(`${u===m?"You take":"Enemy takes"} 5 poison`)}for(const x in u.cd)if(u.cd[x]>0)u.cd[x]--}
if(m.hp<=0||o.hp<=0)end();render()}
function end(){B.over=1;const w=B.o.hp<=0&&B.m.hp>0,g=w?(B.pvp?30:10)+B.o.p.r*15+Math.floor(Math.random()*10):2;S.coins+=g;if(w&&B.pvp)S.wins++;
B.log.push(w?`<span class=win>🏆 Victory! +${g} coins</span>`:`<span class=lose>💀 Defeat. +${g} coins</span>`);save();if(w&&B.pvp)pub()}
function fightP(u){const x=ARENA.find(a=>a.uid==u);if(!x)return;const p=pet(Number(x.id)||0),o=effG(p,{ar:x.ar,ac:x.ac});o.name=`${String(x.nick).slice(0,16)}’s ${p.name}`;start(o,1)}
function buy(k,i){const it=(k=="ar"?ARM:ACC)[i];if(S.coins<it.p){msg="Not enough coins";return render()}if(S.items.includes(k+i))return;S.coins-=it.p;S.items.push(k+i);save();msg="Bought "+it.n;render()}
function eq(k,i){if(S.act==null)return;const g=S.gear[S.act]||(S.gear[S.act]={});g[k]=g[k]===i?undefined:i;save();render()}
function setAct(i){S.act=i;save();render()}
function iap(k){const u=LINKS[k];if(!u){alert("Coming soon!");return}window.open(u,"_blank")}
function card(p,x){return `<div class=pet><div class=em>${p.em}</div><div style="flex:1"><b>${esc(p.name)}</b> <span class=tag style="background:${R[p.r][1]}">${R[p.r][0]}</span><div class=mu>#${p.id} · ${TY[p.t]}</div><div class=mu>❤️${x.hp} ⚔️${x.a} 🛡️${x.d} ⚡${x.s}</div><div class=mu>${p.ab.map(i=>AB[i].i+AB[i].n).join(" · ")}</div></div></div>`}
const bar=(u,n)=>`<div class=row><b>${u.p.em} ${esc(u.p.name)}</b><span class=mu>${Math.max(0,u.hp)}/${u.max}${u.sh?" 🛡️":""}${u.stun?" ⚡":""}${u.psn?" ☠️":""}</span></div><div class=bar><i style="width:${Math.max(0,u.hp)/u.max*100}%"></i></div>`;
function render(){if(!window.FB){v.innerHTML="Loading…";return}document.getElementById("co").textContent=S.coins;document.getElementById("ut").innerHTML=FB.on&&FB.user?`<button class=s onclick="FB.out()">Log out</button>`:"";if(FB.on&&!FB.user){nv.innerHTML="";v.innerHTML=landing();return}
const T={scan:"🎟️ Redeem",pets:"🐾 Pets",fight:"⚔️ Fight",arena:"🌐 Arena",shop:"🛒 Shop",store:"💵 Store"};
nv.innerHTML=Object.keys(T).map(k=>`<button class="${k==tab?"on":""}" onclick="tab='${k}';msg='';render()">${T[k]}</button>`).join("");
let h=msg?`<div class=card>${msg}</div>`:"";
if(tab=="scan")h+=`<div class=card><b>Enter a code</b><div class=mu>Each code works once and gives you a pet. Buy codes in the Store tab.</div><input id=ci placeholder="QRP-XXXXXXXX" autocapitalize=characters><button onclick="scan(ci.value)">Redeem</button></div><div class=card><b>🎁 Free daily pet</b><div class=mu>Come back every day for a free pet.</div><button class=s onclick="daily()">Claim</button></div><div class=mu>Collected: ${new Set(S.pets).size}/1000 · Wins: ${S.wins}</div>`;
if(tab=="pets")h+=[...new Set(S.pets)].map(pet).map(p=>`<div class=card>${card(p,eff(p))}<div class=row><span class=mu>${S.gear[p.id]?`${(ARM[S.gear[p.id].ar]||{}).n||""} ${(ACC[S.gear[p.id].ac]||{}).n||""}`:"No gear"}</span><button class="${S.act==p.id?"":"s"}" onclick="setAct(${p.id})">${S.act==p.id?"Active":"Set active"}</button></div></div>`).join("");
if(tab=="fight"){if(!B)h+=`<div class=card>${card(pet(S.act),eff(pet(S.act)))}<button onclick="pve()">Find opponent</button><div class=mu>Win coins, then buy gear in the Shop. Use abilities (they recharge) to win.</div></div>`;
else{h+=`<div class=card>${bar(B.m)}${bar(B.o)}${B.over?`<button onclick="B=null;render()">Back</button><button class=s onclick="${B.pvp?"tab='arena';B=null;render()":"pve()"}">${B.pvp?"Arena":"Fight again"}</button>`:`<button onclick="turn('atk')">⚔️ Attack</button><button class=s onclick="turn('def')">🛡️ Defend</button>${B.m.p.ab.map(i=>`<button onclick="turn('ab',${i})" ${B.m.cd[i]>0?"disabled":""}>${AB[i].i} ${AB[i].n}${B.m.cd[i]>0?" ("+B.m.cd[i]+")":""}</button>`).join("")}<div class=mu>${B.m.p.ab.map(i=>AB[i].n+": "+AB[i].d).join(" · ")}</div>`}</div><div class="card log">${B.log.slice(-8).reverse().join("<br>")}</div>`}}
if(tab=="arena"){if(!FB.on)h+=`<div class=card><b>🌐 Multiplayer</b><div class=mu>Turn on accounts (see SETUP.md) to unlock the arena.</div></div>`;
else{if(!arenaOn){arenaOn=1;refresh()}h+=`<div class=card><b>Your arena pet</b><input id=nk placeholder="Nickname" maxlength=16 value="${esc(S.nick)}" onchange="S.nick=this.value;save()"><button onclick="S.nick=nk.value;save();pub()">Join / update</button><button class=s onclick="refresh()">Refresh</button><div class=mu>${esc(aMsg)}</div></div><h3>🏆 Leaderboard</h3>`+
(ARENA.length?ARENA.map(a=>{const p=pet(Number(a.id)||0),me=a.uid==FB.user.uid;return `<div class="card row"><div><b>${esc(a.nick)}${me?" (you)":""}</b><div class=mu>${p.em} ${esc(p.name)} · ${R[p.r][0]} · ${Number(a.wins)||0} wins</div></div>${me?"":`<button onclick="fightP('${esc(a.uid)}')" ${S.act==null?"disabled":""}>Fight</button>`}</div>`}).join(""):`<div class=card>No players yet. Be the first!</div>`)}}
if(tab=="shop"){const row=(k,L)=>L.map((it,i)=>{const own=S.items.includes(k+i),on=S.act!=null&&(S.gear[S.act]||{})[k]===i;return `<div class="card row"><div><b>${it.n}</b><div class=mu>${k=="ar"?"🛡️+"+it.d:"⚔️+"+it.a+(it.s?" ⚡+"+it.s:"")}</div></div>${own?`<button class=s onclick="eq('${k}',${i})">${on?"Unequip":"Equip"}</button>`:`<button onclick="buy('${k}',${i})">🪙${it.p}</button>`}</div>`}).join("");
h+=`<h3>Armor</h3>${row("ar",ARM)}<h3>Accessories</h3>${row("ac",ACC)}<div class=mu>Gear equips on your active pet.</div>`}
if(tab=="store")h+=`<div class=card><b>Buy pet codes</b><div class=mu>Pay, then the seller sends you your code(s). Enter them on the Redeem tab. Bundles save up to 30%.</div></div>`+TIERS.map(t=>`<div class=card><b>${t[1]} pet code</b><div>${SIZES.map((n,j)=>`<button onclick="iap('${t[0]}${n}')">${n==1?"1 code":n+"-pack"} · $${t[2][j]}</button>`).join("")}</div></div>`).join("")+`<div class=card><div class=row><span class=mu>Tip the creator ☕</span><button class=s onclick="iap('tip')">Tip</button></div></div>`;
document.getElementById("v").innerHTML=h}
const DEF=()=>({coins:100,seen:[],pets:[],items:[],gear:{},act:null,wins:0,nick:"",daily:0});
async function scan(code){code=(code||"").trim().toUpperCase().replace(/\s+/g,"");if(!code)return;
if(FB.on){msg="Checking…";render();const r=await FB.redeem(code);if(r==-2)msg="⚠️ Could not check the code. Try again.";else if(r<0)msg="❌ Invalid or already used code.";else{give(r,"🎉 You got ");return render()}return render()}
if(!ok(code)){msg="❌ Invalid code. Check it and try again.";return render()}
const h=String(hash(code));if(S.seen.includes(h)){msg="❌ This code was already used. Each code works once!";return render()}
S.seen.push(h);give(hash(code)%1000,"🎉 You got ");render()}
function onUser(u,d){if(FB.on)S={...DEF(),...(d||{})};if(u||!FB.on){if(!S.pets.length)give(Math.floor(Math.random()*600),"👋 Welcome! Your starter pet: ")}tab="scan";B=null;arenaOn=0;render()}
let arenaOn=0;function refresh(){FB.board().then(a=>{ARENA=a;if(tab=="arena")render()}).catch(()=>{aMsg="Arena offline"})}
async function pub(){if(!FB.on||!FB.user||S.act==null)return;const g=S.gear[S.act]||{};try{await FB.pub({nick:S.nick||"Player",id:S.act,ar:g.ar==null?-1:g.ar,ac:g.ac==null?-1:g.ac,wins:S.wins,t:Date.now()});aMsg="✅ Arena pet saved";refresh()}catch(e){aMsg="Could not save"}if(tab=="arena")render()}
async function doAuth(m){const e=em.value.trim(),p=pw.value;msg="";try{await(m=="up"?FB.signup(e,p):FB.login(e,p))}catch(x){const c=x.code||"";msg="❌ "+(c.includes("email-already")?"That email is already registered. Log in instead.":c.includes("weak")?"Password must be at least 6 characters.":c.includes("invalid-email")?"Enter a valid email.":/credential|password|user-not-found/.test(c)?"Wrong email or password.":"Something went wrong. Try again.");render()}}
function landing(){return (msg?`<div class=card>${msg}</div>`:"")+`<div class=card><h2>Collect pets. Battle friends. 🐾</h2><div class=mu>Over 1,000 pets, powerful abilities, armor, and a live arena leaderboard. Free to play.</div></div>
<div class=card><b>Sign up free</b><input id=em type=email placeholder="Email" autocomplete=email><input id=pw type=password placeholder="Password (6+ characters)" autocomplete=current-password><button onclick="doAuth('up')">Sign up</button><button class=s onclick="doAuth('in')">Log in</button><div class=mu>You get a free starter pet and a new free pet every day.</div></div>
<div class=card><b>Why play</b><div class=mu>⚔️ Turn-based battles with 6 abilities<br>🛡️ Armor and accessories to buy<br>🌐 Fight other players in the Arena<br>🎟️ Rare, Epic and Legendary pet codes</div></div>`+TIERS.map(t=>`<div class=card><b>${t[1]} pet codes</b><div>${SIZES.map((n,j)=>`<button class=s onclick="iap('${t[0]}${n}')">${n==1?"1 code":n+"-pack"} · $${t[2][j]}</button>`).join("")}</div></div>`).join("")}
setTimeout(()=>{if(!window.FB)document.getElementById("v").innerHTML='<div class="card">⚠️ Could not load. Open this from your website link (not from the Files app), and check your internet.</div>'},5000);
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,runTransaction,collection,getDocs,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// PASTE YOUR FIREBASE CONFIG HERE (see SETUP.md). Leave apiKey as PASTE_HERE for offline demo mode.
const CFG={apiKey:"AIzaSyAk4WAdnh3gh0AwclWhoXKfziweiZDK-70",authDomain:"qr-pets-380f0.firebaseapp.com",projectId:"qr-pets-380f0",appId:"1:352724724489:web:221a5d31b3df23e4cec1d8"};
const FB=window.FB={on:false,user:null};
try{if(CFG.apiKey!=="PASTE_HERE"){const app=initializeApp(CFG),au=getAuth(app),db=getFirestore(app);FB.on=true;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
FB.signup=(e,p)=>createUserWithEmailAndPassword(au,e,p);FB.login=(e,p)=>signInWithEmailAndPassword(au,e,p);FB.out=()=>signOut(au);
let t;FB.save=s=>{clearTimeout(t);t=setTimeout(()=>{if(FB.user)setDoc(doc(db,"users",FB.user.uid),JSON.parse(JSON.stringify(s))).catch(()=>{})},800)};
FB.redeem=async c=>{const r=doc(db,"codes",await sha(c));try{return await runTransaction(db,async tx=>{const d=await tx.get(r);if(!d.exists())return -1;tx.delete(r);return d.data().pet})}catch(e){return -2}};
FB.pub=o=>setDoc(doc(db,"players",FB.user.uid),o);
FB.board=async()=>(await getDocs(query(collection(db,"players"),orderBy("wins","desc"),limit(20)))).docs.map(d=>({uid:d.id,...d.data()}));
onAuthStateChanged(au,async u=>{FB.user=u;let d=null;if(u){try{d=(await getDoc(doc(db,"users",u.uid))).data()}catch(e){}}window.onUser(u,d)})}}catch(e){FB.on=false}
if(!FB.on)window.onUser(null,null);
</script></body></html>
