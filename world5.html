<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>QR Pets</title>
<style>
:root{--bg:#f6f4ff;--cd:#fff;--tx:#1c1b2e;--mu:#6b6a80;--ac:#6c4cf5;--ln:#e3e0f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--cd:#1e1b30;--tx:#f0eefc;--mu:#9d9ab8;--ac:#8f78ff;--ln:#34304f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121f;--cd:#1e1b30;--tx:#f0eefc;--mu:#9d9ab8;--ac:#8f78ff;--ln:#34304f;color-scheme:dark}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;max-width:560px;padding:12px 12px 84px}
h2,h3{margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center}.coin{font-weight:700}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;margin:3px 3px 3px 0}button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}button:disabled{opacity:.4}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:auto}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 0;font-size:12px;margin:0}nav button.on{color:var(--ac)}
.pet{display:flex;gap:10px;align-items:center}.em{font-size:44px}.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px}
.log{max-height:200px;overflow:auto;font-size:14px}.win{color:#2fa86a;font-weight:700}.lose{color:#e04a4a;font-weight:700}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%;background:#2fa86a;transition:width .3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bobf{0%,100%{transform:translateY(0) scaleX(-1)}50%{transform:translateY(-8px) scaleX(-1)}}
@keyframes lm{0%,100%{transform:translateX(0)}40%{transform:translateX(70px) scale(1.15)}}
@keyframes lo{0%,100%{transform:translateX(0)}40%{transform:translateX(-70px) scale(1.15)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-44px)}}
.em{animation:bob 2s ease-in-out infinite}
.stage{display:flex;justify-content:space-around;align-items:flex-end;height:170px;background:linear-gradient(var(--bg),var(--ln));border-radius:12px;margin-bottom:10px;overflow:hidden}
.fig{position:relative;width:45%;text-align:center;transition:opacity .4s}.fig .sp{font-size:72px;line-height:1.1;animation:bob 1.6s ease-in-out infinite}.fig.o .sp{animation-name:bobf}
.fig.m.atk{animation:lm .6s}.fig.o.atk{animation:lo .6s}.fig.hit{animation:shake .5s;filter:drop-shadow(0 0 10px #e04a4a)}.fig.stun{animation:shake .5s;filter:drop-shadow(0 0 10px #e0c020)}
.fig.heal{animation:glow .7s;filter:drop-shadow(0 0 12px #2fa86a)}.fig.buff{animation:glow .7s;filter:drop-shadow(0 0 12px #2f7be0)}
.fig.ko{opacity:.35;transform:rotate(80deg) translateY(20px)}.fig.ko .sp{animation:none}
.pop{position:absolute;top:0;left:50%;font-weight:800;font-size:24px;color:#e04a4a;pointer-events:none;animation:up 1s forwards}.heal .pop{color:#2fa86a}
.hab{position:relative;height:230px;border-radius:14px;overflow:hidden;background:linear-gradient(#bfe9ff,#9be37d 62%,#6cc35a);border:1px solid var(--ln);margin:10px 0 6px}
.wp{position:absolute;left:0;top:0;width:48px;height:48px;cursor:pointer}.sp2{font-size:36px;line-height:48px;text-align:center;animation:bob .9s ease-in-out infinite}
.wp.act .fl{filter:drop-shadow(0 0 6px gold) drop-shadow(0 0 2px gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes tw{0%,100%{transform:scale(.6);opacity:.6}50%{transform:scale(1.2);opacity:1}}
.ar .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}.ar .tw{transform-box:fill-box;transform-origin:center;animation:tw 1.6s ease-in-out infinite}
.em{width:64px;height:64px;flex:none;font-size:0}.fig .sp{display:flex;justify-content:center;line-height:0;font-size:0}.sp2{display:flex;justify-content:center;align-items:center;height:48px;font-size:0}
.bf{position:relative;height:min(50vh,380px);border-radius:14px;overflow:hidden;background:linear-gradient(#bfe9ff,#9be37d 45%,#6cc35a);border:1px solid var(--ln);touch-action:none}
.ent{position:absolute;left:0;top:0;will-change:transform}.ent svg{animation:bob .8s ease-in-out infinite}.ent .fl{line-height:0;font-size:0}
.hud{position:absolute;left:8px;right:8px;top:6px;font:700 14px system-ui;color:#143;text-shadow:0 1px 0 #fff8;z-index:5}.hb{height:9px;background:#0003;border-radius:9px;overflow:hidden;margin-top:4px}.hb i{display:block;height:100%;width:100%;background:#2fa86a}
.shot{position:absolute;border-radius:50%;will-change:transform}
.fx{position:absolute;border:4px solid;border-radius:50%;animation:rg .5s forwards;pointer-events:none}@keyframes rg{from{transform:scale(.2);opacity:1}to{transform:scale(1);opacity:0}}
.fpop{position:absolute;font-weight:800;font-size:16px;animation:up .8s forwards;pointer-events:none;z-index:6;text-shadow:0 1px 2px #0008;white-space:nowrap}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.joy{width:130px;height:130px;border-radius:50%;background:var(--cd);border:3px solid var(--ln);position:relative;touch-action:none;flex:none}
.knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:var(--ac);box-shadow:0 2px 8px #0006;pointer-events:none}
.abs{display:flex;gap:12px}.abtn{width:76px;height:76px;border-radius:50%;font-size:32px;padding:0;position:relative;margin:0}.abtn span{position:absolute;right:8px;bottom:4px;font-size:14px}
.abtn,.joy{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
nav{overflow-x:auto}nav button{flex:0 0 auto;min-width:68px;padding:10px 8px}
.fs{position:fixed;left:0;top:0;right:0;bottom:0;z-index:1000;background:#6cc35a;touch-action:none;overflow:hidden}
.fs .bf{position:absolute;left:0;top:0;right:0;bottom:0;height:auto;border-radius:0;border:0}
.fs .joy{position:absolute;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));background:#ffffff55;border-color:#fff9;z-index:20}
.fs .abs{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;align-items:flex-end;gap:10px;max-width:62%}
.abtn.jmp{width:88px;height:88px;background:#f5a623}
.xbtn{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:20;width:44px;height:44px;border-radius:50%;padding:0;background:#0008;font-size:18px}
.fs .hud{top:calc(10px + env(safe-area-inset-top,0px));right:68px;left:calc(12px + env(safe-area-inset-left,0px))}
.shadow{position:absolute;left:0;top:0;width:44px;height:14px;border-radius:50%;background:#0004}
body{background:radial-gradient(900px 420px at 50% -80px,#d8ccff,transparent 70%),var(--bg);background-attachment:fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(900px 420px at 50% -80px,#3a2d78,transparent 70%),var(--bg)}}
:root[data-theme="dark"] body{background:radial-gradient(900px 420px at 50% -80px,#3a2d78,transparent 70%),var(--bg)}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;margin:6px 0}
.chest{pointer-events:none}.chest svg{animation:bob 1s ease-in-out infinite;filter:drop-shadow(0 0 8px gold)}
.deco{position:absolute;pointer-events:none;opacity:.9;line-height:1}
.pots{position:absolute;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(170px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:20}
.pbtn{width:52px;height:52px;border-radius:50%;font-size:24px;padding:0;position:relative;margin:0;background:#2b6cb0}.pbtn span{position:absolute;right:0;bottom:-2px;font-size:13px;background:#000a;border-radius:9px;padding:0 5px}
.ent svg.r5{animation:bobmyth 1.6s ease-in-out infinite}
@keyframes myth{from{filter:hue-rotate(0deg) drop-shadow(0 0 10px #ff3d9a)}to{filter:hue-rotate(360deg) drop-shadow(0 0 10px #ff3d9a)}}
@keyframes bobmyth{0%,100%{transform:translateY(0);filter:hue-rotate(0deg) drop-shadow(0 0 10px #ff3d9a)}50%{transform:translateY(-8px);filter:hue-rotate(180deg) drop-shadow(0 0 10px #ff3d9a)}}
.ar.r5{animation:myth 5s linear infinite}
</style></head><body>
<div class="top"><h2>🐾 QR Pets</h2><div class="coin">🪙 <span id="co"></span> <span id="ut"></span></div></div>
<div id="v"><div class="card">Loading…</div></div><nav id="nv"></nav>
<script>
const R=[["Common","#8a8a9a"],["Uncommon","#2fa86a"],["Rare","#2f7be0"],["Epic","#a24ae0"],["Legendary","#d99a10"],["Mythical","#ff3d9a"]];
const rar=i=>i<600?0:i<850?1:i<950?2:i<990?3:i<1000?4:5;
const NA=["Fluffy","Shadow","Blaze","Frost","Mossy","Zappy","Tiny","Mighty","Sneaky","Golden"],NB=["Fox","Drake","Owl","Slime","Bear","Newt","Wolf","Moth","Crab","Bunny"],EM=["🦊","🐉","🦉","🟢","🐻","🦎","🐺","🦋","🦀","🐰"],TY=["🔥Fire","💧Water","🌿Leaf"];
const AB=[{n:"Fireball",i:"🔥",d:"1.8x damage"},{n:"Heal",i:"💚",d:"Restore 30% HP"},{n:"Stun",i:"⚡",d:"Enemy skips a turn"},{n:"Shield",i:"🛡️",d:"Halve the next hit"},{n:"Poison",i:"☠️",d:"5 dmg for 3 turns"},{n:"Drain",i:"🧛",d:"Hit and heal half"}];
const ARM=[{n:"Leather Vest",p:60,d:4},{n:"Iron Plate",p:200,d:10},{n:"Dragon Mail",p:600,d:22}];
const ACC=[{n:"Speed Boots",p:50,a:2,s:3},{n:"Power Ring",p:150,a:7,s:0},{n:"Crown",p:500,a:14,s:5}];
const TIERS=[["rare","Rare",[1,4,7]],["epic","Epic",[2,8,14]],["legend","Legendary",[4,16,28]],["myth","Mythical",[15,60,105]]],SIZES=[1,5,10];
const LINKS={tip:"",rare1:"",rare5:"",rare10:"",epic1:"",epic5:"",epic10:"",legend1:"",legend5:"",legend10:"",myth1:"",myth5:"",myth10:""};const PAY={bpay:"@vexqmc",contact:"Instagram @shacko_donn",ig:"shacko_donn",rate:160,on:false};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const MYN=["Aurora Fox","Void Drake","Starlight Owl","Nova Slime","Eclipse Bear","Tidal Newt","Phantom Wolf","Celestial Moth","Prism Crab","Mirage Bunny","Solar Fox","Abyss Drake","Lunar Owl","Cosmic Slime","Ember Bear","Glacier Newt","Thunder Wolf","Dream Moth","Coral Crab","Spirit Bunny"];
const spOf=i=>i>=1000?(i-1000)%10:Math.floor(i/10)%10;
const pet=i=>{const r=rar(i),b=40+r*18;return{id:i,r,name:i>=1000?MYN[(i-1000)%20]:NA[i%10]+" "+NB[spOf(i)],em:EM[spOf(i)],t:i%3,hp:b*2+i*7%20,a:Math.round(b/2)+i*3%8,d:Math.round(b/4)+i%5,s:10+i*5%15,ab:r>=5?[i%6,(i+2)%6,(i+4)%6]:r>=3?[i%6,(i+3)%6]:[i%6]}};
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const ok=c=>/^QRP-[A-Z0-9]{8}$/.test(c)&&hash("k7"+c)%61==3&&hash("m2"+c)%61==5;
let S={coins:100,seen:[],pets:[],items:[],gear:{},act:null,wins:0,nick:"",daily:0},tab="scan",msg="",B=null,DB=null,UID=null,ARENA=[],aMsg="";
try{const x=JSON.parse(localStorage.getItem("qrp")||"null");if(x)S={...S,...x}}catch(e){}
const save=()=>{try{localStorage.setItem("qrp",JSON.stringify(S))}catch(e){}if(window.FB&&FB.on&&FB.user)FB.save(S)};
const effG=(p,g)=>{g=g||{};const ar=ARM[g.ar]||{d:0},ac=ACC[g.ac]||{a:0,s:0};return{...p,a:p.a+ac.a,d:p.d+ar.d,s:p.s+ac.s}};

function give(id,pre){S.pets.push(id);if(S.act==null)S.act=id;const p=pet(id);msg=`${pre}${art(id,56,1)} ${p.name} (#${id}) — ${R[p.r][0]}!`;save()}
function daily(){const w=20*36e5-(Date.now()-(S.daily||0));if(w>0){msg=`⏳ Next free pet in about ${Math.ceil(w/36e5)}h`;return render()}
let id,n=0;do{id=Math.floor(Math.random()*600)}while(S.pets.includes(id)&&++n<50);give(id,"🎁 Free daily pet: ");S.daily=Date.now();save();render()}
const dm=(x,y)=>Math.max(1,Math.round(x.a*(x.t==(y.t+2)%3?1.3:x.t==(y.t+1)%3?.8:1)-y.d/2+Math.random()*4));
const mk=p=>({p,hp:p.hp,max:p.hp,sh:0,stun:0,psn:0,cd:{}});
function start(op,pvp){const me=eff(pet(S.act));B={m:mk(me),o:mk(op),log:[`${me.name} vs ${op.name}`],over:0,pvp,fx:{},pop:{}};tab="fight";render()}
function pve(){const me=pet(S.act),mr=Math.min(4,me.r+(Math.random()<.3?1:0));let id;do{id=Math.floor(Math.random()*1000)}while(rar(id)>mr);const sc=.8+Math.random()*.3,o=pet(id);start({...o,hp:Math.round(o.hp*sc),a:Math.round(o.a*sc)},0)}
function end(){B.over=1;const w=B.o.hp<=0&&B.m.hp>0,g=w?(B.pvp?30:10)+B.o.p.r*15+Math.floor(Math.random()*10):2;S.coins+=g;if(w&&B.pvp)S.wins++;
B.log.push(w?`<span class=win>🏆 Victory! +${g} coins</span>`:`<span class=lose>💀 Defeat. +${g} coins</span>`);save();if(w&&B.pvp)pub()}
function fightP(u){const x=ARENA.find(a=>a.uid==u);if(!x)return;const p=pet(Number(x.id)||0),o=effG(p,{ar:x.ar,ac:x.ac});o.name=`${String(x.nick).slice(0,16)}’s ${p.name}`;start(o,1)}
function buy(k,i){const it=(k=="ar"?ARM:ACC)[i];if(S.coins<it.p){msg="Not enough coins";return render()}if(S.items.includes(k+i))return;S.coins-=it.p;S.items.push(k+i);save();msg="Bought "+it.n;render()}
function eq(k,i){if(S.act==null)return;const g=S.gear[S.act]||(S.gear[S.act]={});g[k]=g[k]===i?undefined:i;save();render()}
function setAct(i){S.act=i;save();render()}
let sel=null;
function iap(k){const u=LINKS[k];if(u){window.open(u,"_blank");return}sel=k;render();window.scrollTo(0,0)}
function payCard(){if(!sel)return "";if(!PAY.on)return `<div class=card><b>🛒 Coming soon!</b><div class=mu style="margin:6px 0">Buying codes opens very soon. Follow <a href="https://instagram.com/${esc(PAY.ig)}" target="_blank" rel="noopener" style="color:var(--ac)">@${esc(PAY.ig)}</a> on Instagram to hear first.</div><button class=s onclick="sel=null;render()">Close</button></div>`;const m=sel.match(/^([a-z]+)(\d*)$/),t=TIERS.find(x=>x[0]==m[1]);let what="a tip",usd=0,n=1;if(t){n=+m[2];what=`${t[1]} pet code${n>1?"s ×"+n:""}`;usd=t[2][SIZES.indexOf(n)]}
const can=t&&FB.on&&FB.user;
return `<div class=card><b>🛒 ${what}${usd?` · $${usd} (about J$${Math.round(usd*PAY.rate)})`:""}</b><div class=mu style="margin:6px 0">1. Send the money to BPay: <b>${esc(PAY.bpay)}</b><br>2. Come back here and tap the button below.<br>3. Your code${n>1?"s":""} will appear in <b>My orders</b> as soon as the payment is confirmed.<br>Problem? Message <a href="https://instagram.com/${esc(PAY.ig)}" target="_blank" rel="noopener" style="color:var(--ac)">${esc(PAY.contact)}</a>.</div>${can?`<input id=oref placeholder="Your BPay name or reference" maxlength=60><button onclick="submitOrder()">✅ I paid. Send my code${n>1?"s":""}</button>`:`<div class=mu>${t?"Log in first to place an order.":"Thank you! ☕"}</div>`}<button class=s onclick="sel=null;render()">Close</button></div>`}
let ORD=[],ordUn=null,ordSub=0,ordMsg="";
function ordWatch(){if(ordSub||!FB.on||!FB.user)return;ordSub=1;ordUn=FB.myOrders(a=>{ORD=a.sort((x,y)=>(y.t||0)-(x.t||0));if(tab=="store")render()})}
async function submitOrder(){const m=(sel||"").match(/^([a-z]+)(\d+)$/),ref=((document.getElementById("oref")||{}).value||"").trim().slice(0,60);if(!m||!FB.user)return;
if(!ref){ordMsg="Type your BPay name or reference first.";return render()}
const t=TIERS.find(x=>x[0]==m[1]),n=+m[2];try{await FB.order({uid:FB.user.uid,email:FB.user.email,tier:m[1],n,usd:t[2][SIZES.indexOf(n)],ref,st:"pending",codes:[],t:Date.now()});sel=null;ordMsg="✅ Order sent! Your code will show up below once your payment is confirmed (usually a few minutes)."}catch(e){ordMsg="Could not send the order. Try again."}render()}
function ordersHTML(){if(!FB.on||!FB.user)return "";const L=ORD.map(o=>{const t=TIERS.find(x=>x[0]==o.tier),nm=t?t[1]:o.tier;return `<div style="margin:8px 0;padding-top:8px;border-top:1px solid var(--ln)"><div class=row><span>${esc(nm)} ×${Number(o.n)||1} · $${Number(o.usd)||0}</span><span>${o.st=="done"?"✅ Ready":o.st=="rejected"?"❌ Rejected":"⏳ Waiting"}</span></div>${o.st=="done"?(o.codes||[]).map(c=>`<div class=row style="margin:4px 0"><b style="letter-spacing:1px">${esc(c)}</b><button onclick="scan('${esc(c)}')">Redeem</button></div>`).join(""):""}</div>`}).join("");
return `<div class=card><b>📦 My orders</b>${ordMsg?`<div class=mu>${esc(ordMsg)}</div>`:""}${L||`<div class=mu>No orders yet.</div>`}</div>`}
function card(p,x){return `<div class=pet><div class=em>${art(p.id,64)}</div><div style="flex:1"><b>${esc(p.name)}</b> <span class=tag style="background:${R[p.r][1]}">${R[p.r][0]}</span><div class=mu>#${p.id} · ${TY[p.t]}</div><div class=mu>❤️${x.hp} ⚔️${x.a} 🛡️${x.d} ⚡${x.s}</div><div class=mu>${p.ab.map(i=>AB[i].i+AB[i].n).join(" · ")}</div><div class=mu>💰 Value ${value(p.id)}</div></div></div>`}
const bar=(u,n)=>`<div class=row><b>${art(u.p.id,22)} ${esc(u.p.name)}</b><span class=mu>${Math.max(0,u.hp)}/${u.max}${u.sh?" 🛡️":""}${u.stun?" ⚡":""}${u.psn?" ☠️":""}</span></div><div class=bar><i style="width:${Math.max(0,u.hp)/u.max*100}%"></i></div>`;
function render(){fixS();if(!window.FB){v.innerHTML="Loading…";return}document.getElementById("co").textContent=S.coins;document.getElementById("ut").innerHTML=FB.on&&FB.user?`<button class=s onclick="FB.out()">Log out</button>`:"";if(FB.on&&!FB.user){nv.innerHTML="";v.innerHTML=landing();return}if(FB.on&&FB.user&&!FB.loaded){nv.innerHTML="";v.innerHTML=loadErr?`<div class=card>⚠️ ${loadErr==1?"Could not load your saved game.":"Could not create your save."} This usually means the Firebase rules are not published yet, or you are offline. Nothing was changed.<br><button onclick="location.reload()">Try again</button> <button class=s onclick="FB.out()">Log out</button></div>`:`<div class=card>Loading your game…</div>`;return}
const T={scan:"🎟️ Redeem",pets:"🐾 Pets",fight:"⚔️ Fight",brawl:"🕹️ Brawl",bag:"🎒 Bag",arena:"🌐 Arena",friends:"👥 Friends",shop:"🛒 Shop",store:"💵 Store"};
